<svg xmlns="http://www.w3.org/2000/svg" width="410" height="500" viewBox="0 0 410 500">
  <rect width="410" height="500" rx="80" fill="#0e0e0f"/>
  <text x="205" y="70" fill="#888785" font-family="sans-serif" font-size="14" text-anchor="middle">Bench Press</text>
  <text x="60" y="140" fill="#f0efed" font-family="sans-serif" font-size="18" font-weight="600">Bench Press</text>
  <text x="60" y="165" fill="#555452" font-family="sans-serif" font-size="13">Last: 185 lbs</text>
  <text x="205" y="280" fill="#c8b89a" font-family="monospace" font-size="64" text-anchor="middle" font-weight="bold">185</text>
